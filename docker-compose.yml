version: '3.8'

services:
  client:
    build:
      context: ./source
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "3001:80" # Frontend accessible at localhost:3000
    networks:
      - your-network

  backend:
    build:
      context: ./source
      dockerfile: docker/api/Dockerfile
    ports:
      - "5001:80" # Backend accessible at localhost:5000
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - your-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./source/docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - client
      - backend
    networks:
      - your-network

networks:
  your-network:
    driver: bridge
