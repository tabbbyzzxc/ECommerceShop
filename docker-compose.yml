services:
  client:
    build:
      context: ./source
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "3001:80"
    networks:
      - your-network

  backend:
    build:
      context: ./source
      dockerfile: docker/api/Dockerfile
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=$ASPNETCORE_ENVIRONMENT}
    networks:
      - your-network
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - your-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - your-network


  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./source/docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - client
      - backend
    networks:
      - your-network

networks:
  your-network:
    driver: bridge
volumes:
  postgres-data:
