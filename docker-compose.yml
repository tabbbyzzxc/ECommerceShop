version: '3.8'

services:
  client:
    build:
      context: ./source
      dockerfile: docker/frontend/Dockerfile
    networks:
      - your-network

  backend:
    build:
      context: ./source
      dockerfile: docker/api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - your-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./source/docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - client
      - backend
    networks:
      - your-network

networks:
  your-network:
    driver: bridge
